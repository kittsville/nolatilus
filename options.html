<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nolatilus settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <form id="settings">
      <label for="lead">Displays badge when next meeting is under this many minutes</label>
      <input id="lead" name="lead" type="number" min="1" max="999" step="1" required />
      <button type="submit">Save</button>
      <p id="status" role="status"></p>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
