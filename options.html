<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nolatilus settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <form id="settings">
      <label for="lead">Displays badge when next meeting is under this many minutes</label>
      <input id="lead" name="lead" type="number" min="1" max="999" step="1" required />
      <label class="check" for="accepted-only">
        <input id="accepted-only" name="accepted-only" type="checkbox" />
        Only show badge for accepted events
      </label>
      <label for="ignored">Ignore events whose title contains any of these lines</label>
      <textarea id="ignored" name="ignored" rows="5" spellcheck="false"></textarea>
      <button type="submit">Save</button>
      <p id="status" role="status"></p>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
